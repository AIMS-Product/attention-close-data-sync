name: Avoma API test

on:
  workflow_dispatch:

jobs:
  test-meetings-read:
    runs-on: ubuntu-latest
    steps:
      - name: Check processing status of the test call
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer ${AVOMA_API_KEY}" \
            "https://api.avoma.com/v1/meetings/b08e396b-021d-4071-b461-8324e6680d5b/" \
            -o response.json
          echo "## Meeting status" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat response.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat response.json
        env:
          AVOMA_API_KEY: ${{ secrets.AVOMA_API_KEY }}
