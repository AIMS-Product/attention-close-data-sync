name: Avoma API test

on:
  workflow_dispatch:

jobs:
  test-meetings-read:
    runs-on: ubuntu-latest
    steps:
      - name: Test POST /v1/calls/ against a real Close recording
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            -X POST "https://api.avoma.com/v1/calls/" \
            -H "Authorization: Bearer ${AVOMA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "external_id": "acti_KzEVcfZhIFE1shp0No52kwBAV4VHCGBP6PQajb80IiH",
              "user_email": "kelly@modern-amenities.com",
              "frm": "+15419398196",
              "to": "+17134807880",
              "start_at": "2026-08-18T22:07:31Z",
              "recording_url": "https://api.close.com/call/acti_KzEVcfZhIFE1shp0No52kwBAV4VHCGBP6PQajb80IiH/recording/",
              "direction": "Outbound",
              "source": "close",
              "participants": [
                {"email": "shemikawashington.77@gmail.com", "name": "Shemika Washington"}
              ]
            }' \
            -o response.json
          echo "## POST /v1/calls/ response" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat response.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat response.json
        env:
          AVOMA_API_KEY: ${{ secrets.AVOMA_API_KEY }}
