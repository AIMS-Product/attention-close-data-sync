name: Close → Avoma Dialer Sync

on:
  schedule:
    # Hourly at :15, scheduled AFTER:
    #   :00 - sync.py                              (first sales calls → lead fields)
    #   :05 - avoma_to_close_first_meeting_sync.py  (first sales → Close CA)
    # and BEFORE:
    #   :30 - avoma_to_close_dialer_sync.py         (dialer analyses → Close CA)
    #   :45 - avoma_to_close_meeting_sync.py        (everything else → Close CA)
    # Gives Avoma time to process the recording before :30 looks for it.
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      hours_back:
        description: 'Window of recent Close calls to consider, in hours'
        required: false
        default: '8'
      dry_run:
        description: 'Dry run (1 = log what would happen, skip download/upload/import)'
        required: false
        default: '0'

concurrency:
  group: close-to-avoma-dialer-sync
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests boto3

      - name: Run Close → Avoma dialer sync
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          AVOMA_API_KEY: ${{ secrets.AVOMA_API_KEY }}
          HOURS_BACK: ${{ inputs.hours_back || '8' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
          RECORDING_PROXY_BUCKET: vp-avoma-recordings
        run: python3 -u close_to_avoma_sync.py
