name: Avoma → Close Dialer Enrichment

on:
  schedule:
    # Hourly at :30, scheduled AFTER:
    #   :00 - existing Avoma → Close sync (video calls)
    #   :15 - close_to_avoma_sync (Close dialer → Avoma)
    # This gives uploaded dialer calls 15 minutes to process before we look
    # for them. Late-processed ones get picked up next round (idempotency
    # check prevents duplicates).
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      hours_back:
        description: 'Window of recent Close calls to consider, in hours'
        required: false
        default: '24'
      dry_run:
        description: 'Dry run (1 = log payloads without writing to Close)'
        required: false
        default: '0'
      allow_incomplete_analysis:
        description: 'Round-trip test mode (1 = create the Custom Activity even if Avoma analysis is not ready yet — test only, not for the schedule)'
        required: false
        default: '0'

concurrency:
  group: avoma-to-close-dialer-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run enrichment
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          AVOMA_API_KEY: ${{ secrets.AVOMA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOURS_BACK: ${{ inputs.hours_back || '24' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          ALLOW_INCOMPLETE_ANALYSIS: ${{ inputs.allow_incomplete_analysis || '0' }}
        run: python3 -u avoma_to_close_dialer_sync.py
