name: Avoma → Close Outcome Reconciliation

on:
  schedule:
    # Revisit every unresolved supported Close meeting; older meetings never age out.
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (1 = no Close writes)'
        required: false
        default: '1'

concurrency:
  group: avoma-to-close-first-meeting-sync
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Test outcome reconciliation
        run: python3 -m unittest test_first_meeting_outcome_rules test_close_outcome_backlog test_native_outcome_backlog

      - name: Reconcile Avoma outcomes
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          AVOMA_API_KEY: ${{ secrets.AVOMA_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python3 -u reconcile_close_outcome_backlog.py

      - name: Upload outcome review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avoma-outcome-review-${{ github.run_id }}
          path: avoma_outcome_review.json
          if-no-files-found: warn
          retention-days: 90
